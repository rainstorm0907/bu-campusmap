<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>캠퍼스맵 - 학생 참여형 캠퍼스 생활 정보 지도</title>
  <!-- 글꼴: Pretendard (인터넷이 없으면 기기 기본 글꼴로 보여요) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- 앱(PWA) 설정: 휴대폰 홈 화면에 설치하면 앱처럼 실행 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1f5fd7" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="캠퍼스맵" />

  <!-- [네이버 지도 API] 키는 js/config.js 에 넣습니다. 키가 없거나 인증이 실패하면 임시 지도로 바뀝니다. -->
  <script src="js/config.js"></script>
  <script>
    (function () {
      const fail = () => { window.MAP_STATUS = "failed"; window.onNaverMapFail && window.onNaverMapFail(); };
      window.navermap_authFailure = fail;
      // 서버 오류(500 등)는 authFailure 없이 콘솔에만 찍히므로 같이 본다
      ["log", "info", "warn", "error"].forEach((k) => {
        const orig = console[k].bind(console);
        console[k] = (...args) => {
          if (window.MAP_STATUS !== "failed" && args.some((a) => /NAVER Maps[\s\S]*Error Code/.test(String(a)))) fail();
          orig(...args);
        };
      });
      if (window.NAVER_MAP_KEY_ID) {
        document.write('<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(window.NAVER_MAP_KEY_ID) + '"><\/script>');
      }
    })();
  </script>
</head>
<body>
  <!-- ★ 지도 컨테이너 (id 변경 금지: js/map.js 에서 사용) -->
  <div id="map"></div>

  <!-- 위: 검색창 + 분류 -->
  <header class="top">
    <form class="search" id="searchForm" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#626873" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="searchInput" type="search" placeholder="무엇이든 물어보세요" enterkeyhint="search" autocomplete="off" />
    </form>
    <nav class="cats" id="cats" aria-label="분류"></nav>
  </header>

  <!-- 오른쪽 버튼 -->
  <button class="fab" id="chatFab" aria-label="챗봇 열기" aria-expanded="false" aria-controls="chatPanel">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#E9F0FC" stroke="#1F5FD7" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>
  </button>
  <button class="fab" id="locateBtn" aria-label="내 위치">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="1.8"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
  </button>

  <!-- 아래 시트: 학사일정 / 목록 / 건물 요약 / 건물 페이지 -->
  <section class="sheet" id="sheet" aria-label="정보">
    <div class="grab" id="grab"><i></i></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
  <button class="fixbtn" id="fixReport" hidden>이 건물 정보 제보하기</button>
  <div class="toast" id="toast" role="status"></div>
  <div id="sab" aria-hidden="true"></div>

  <!-- 챗봇 (화면 흐름: js/app.js, 답변과 카드: js/chatbot.js) -->
  <section class="chat hidden" id="chatPanel" aria-label="캠퍼스 챗봇">
    <header class="chat-head">
      <span class="chat-mark" aria-hidden="true"></span>
      <div class="chat-title">
        <strong>캠퍼스 챗봇</strong>
        <small>학식, 시설 위치, 일정을 찾아드려요</small>
      </div>
      <button class="chat-icon" id="chatReset" aria-label="새 대화" title="새 대화">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
      </button>
      <button class="chat-icon" id="chatClose" aria-label="닫기" title="닫기">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="chat-suggest" id="chatSuggest" hidden></div>
    <form class="chat-input" id="chatForm">
      <div class="chat-field">
        <input id="chatInput" placeholder="학식, 시설, 일정을 물어보세요" autocomplete="off" enterkeyhint="send" aria-label="챗봇에게 질문" />
        <button type="button" class="chat-mic" id="chatMic" aria-label="음성으로 묻기" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
      </div>
      <button class="chat-send" id="chatSend" aria-label="보내기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
  </section>

  <!-- 확인 창: 걷는 길 안내 시작 -->
  <dialog id="navConfirm" class="confirm">
    <form method="dialog">
      <span class="confirm-ic" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v3M9 12l2-4 4 1 2 4M8 9l-2 4"/></svg></span>
      <h2 tabindex="-1" autofocus>경로 안내를 시작할까요?</h2>
      <p id="navConfirmText"></p>
      <div class="confirm-actions">
        <button value="cancel">아니요</button>
        <button value="ok" class="primary-btn">예</button>
      </div>
    </form>
  </dialog>

  <!-- 모달: 분실물 등록 -->
  <dialog id="lostModal">
    <form method="dialog" id="lostForm">
      <h2 tabindex="-1" autofocus>분실물 등록</h2>
      <label>구분
        <select name="type" required>
          <option value="lost">잃어버렸어요</option>
          <option value="found">주웠어요</option>
        </select>
      </label>
      <label>물건 이름 <input name="title" required placeholder="예: 검정색 에어팟 케이스" /></label>
      <label>장소(건물) <select name="buildingId" class="building-select" required></select></label>
      <label>상세 위치 <input name="place" placeholder="예: 3층 열람실 창가" /></label>
      <label>설명 <textarea name="desc" rows="3"></textarea></label>
      <label>연락처 <input name="contact" placeholder="오픈채팅 링크 등" /></label>
      <div class="modal-actions">
        <button value="cancel" formnovalidate>취소</button>
        <button value="ok" class="primary-btn">등록</button>
      </div>
    </form>
  </dialog>

  <!-- 모달: 정보 제보 / 수정 -->
  <dialog id="reportModal">
    <form method="dialog" id="reportForm">
      <h2 tabindex="-1" autofocus>정보 제보, 수정 요청</h2>
      <label>유형
        <select name="kind" required>
          <option value="new">새 시설 추가</option>
          <option value="edit">정보 수정</option>
          <option value="menu">학식 정보</option>
          <option value="etc">기타</option>
        </select>
      </label>
      <label>건물 <select name="buildingId" class="building-select" required></select></label>
      <label>층 <input name="floor" placeholder="예: 2층, 지하 1층" /></label>
      <label>내용 <textarea name="content" rows="4" required placeholder="예: 2층 복도 끝에 정수기가 새로 생겼어요"></textarea></label>
      <div class="modal-actions">
        <button value="cancel" formnovalidate>취소</button>
        <button value="ok" class="primary-btn">제출</button>
      </div>
    </form>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/campus-shapes.js"></script>
  <script src="js/walk-route.js"></script>
  <script src="js/map.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 앱(PWA) 오프라인 지원 - http(s)/localhost 에서만 동작
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
