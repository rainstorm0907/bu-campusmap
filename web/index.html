<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>캠퍼스맵 - 학생 참여형 캠퍼스 생활 정보 지도</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- 앱(PWA) 설정: 휴대폰 홈 화면에 설치하면 앱처럼 실행 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1f5fd7" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="캠퍼스맵" />

  <!-- [네이버 지도 API] 키는 js/config.js 에 넣습니다. 키가 없거나 인증이 실패하면 임시 지도로 바뀝니다. -->
  <script src="js/config.js"></script>
  <script>
    (function () {
      const fail = () => { window.MAP_STATUS = "failed"; window.onNaverMapFail && window.onNaverMapFail(); };
      window.navermap_authFailure = fail;
      // 서버 오류(500 등)는 authFailure 없이 콘솔에만 찍히므로 같이 본다
      ["log", "info", "warn", "error"].forEach((k) => {
        const orig = console[k].bind(console);
        console[k] = (...args) => {
          if (window.MAP_STATUS !== "failed" && args.some((a) => /NAVER Maps[\s\S]*Error Code/.test(String(a)))) fail();
          orig(...args);
        };
      });
      if (window.NAVER_MAP_KEY_ID) {
        document.write('<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(window.NAVER_MAP_KEY_ID) + '"><\/script>');
      }
    })();
  </script>
</head>
<body>
  <!-- ★ 지도 컨테이너 (id 변경 금지: js/map.js 에서 사용) -->
  <div id="map"></div>

  <!-- 위: 검색창 + 분류 -->
  <header class="top">
    <form class="search" id="searchForm" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#626873" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="searchInput" type="search" placeholder="무엇이든 물어보세요" enterkeyhint="search" autocomplete="off" />
    </form>
    <nav class="cats" id="cats" aria-label="분류"></nav>
  </header>

  <!-- 오른쪽 버튼 -->
  <button class="fab" id="chatFab" aria-label="챗봇 열기">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#E9F0FC" stroke="#1F5FD7" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>
  </button>
  <button class="fab" id="locateBtn" aria-label="내 위치">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="1.8"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
  </button>

  <!-- 아래 시트: 학사일정 / 목록 / 건물 요약 / 건물 페이지 -->
  <section class="sheet" id="sheet" aria-label="정보">
    <div class="grab" id="grab"><i></i></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
  <button class="fixbtn" id="fixReport" hidden>이 건물 정보 제보하기</button>
  <div class="toast" id="toast" role="status"></div>
  <div id="sab" aria-hidden="true"></div>

  <!-- 챗봇 -->
  <section class="chat hidden" id="chatPanel" aria-label="캠퍼스 챗봇">
    <header class="chat-head">
      <strong>캠퍼스 챗봇</strong>
      <button class="close" id="chatClose" aria-label="닫기">
        <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </header>
    <div class="chat-log" id="chatLog"></div>
    <div class="chips chat-suggest" id="chatSuggest"></div>
    <form class="chat-input" id="chatForm">
      <input id="chatInput" placeholder="예: 오늘 점심 뭐야?" autocomplete="off" />
      <button class="primary-btn">전송</button>
    </form>
  </section>

  <!-- 모달: 분실물 등록 -->
  <dialog id="lostModal">
    <form method="dialog" id="lostForm">
      <h2 tabindex="-1" autofocus>분실물 등록</h2>
      <label>구분
        <select name="type" required>
          <option value="lost">잃어버렸어요</option>
          <option value="found">주웠어요</option>
        </select>
      </label>
      <label>물건 이름 <input name="title" required placeholder="예: 검정색 에어팟 케이스" /></label>
      <label>장소(건물) <select name="buildingId" class="building-select" required></select></label>
      <label>상세 위치 <input name="place" placeholder="예: 3층 열람실 창가" /></label>
      <label>설명 <textarea name="desc" rows="3"></textarea></label>
      <label>연락처 <input name="contact" placeholder="오픈채팅 링크 등" /></label>
      <div class="modal-actions">
        <button value="cancel" formnovalidate>취소</button>
        <button value="ok" class="primary-btn">등록</button>
      </div>
    </form>
  </dialog>

  <!-- 모달: 정보 제보 / 수정 -->
  <dialog id="reportModal">
    <form method="dialog" id="reportForm">
      <h2 tabindex="-1" autofocus>정보 제보, 수정 요청</h2>
      <label>유형
        <select name="kind" required>
          <option value="new">새 시설 추가</option>
          <option value="edit">정보 수정</option>
          <option value="menu">학식 정보</option>
          <option value="etc">기타</option>
        </select>
      </label>
      <label>건물 <select name="buildingId" class="building-select" required></select></label>
      <label>층 <input name="floor" placeholder="예: 2층, 지하 1층" /></label>
      <label>내용 <textarea name="content" rows="4" required placeholder="예: 2층 복도 끝에 정수기가 새로 생겼어요"></textarea></label>
      <div class="modal-actions">
        <button value="cancel" formnovalidate>취소</button>
        <button value="ok" class="primary-btn">제출</button>
      </div>
    </form>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/campus-shapes.js"></script>
  <script src="js/map.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 앱(PWA) 오프라인 지원 - http(s)/localhost 에서만 동작
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
